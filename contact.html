<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ppertenrex | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav class="nav">
    <div class="logo">Ppertenrex</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="experience.html">Experience</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <section class="card">
    <h1>Contact</h1>
    <p>Want to work together or ask a question? Reach out.</p>
  </section>

  <section class="grid">
    <div class="card">
      <h2>Direct Contact</h2>
      <p><strong>Discord:</strong> Ppertenrex</p>
      <p><strong>Email:</strong> Coming soon!</p>
    </div>

    <div class="card">
      <h2>Contact Form</h2>
      <form class="form">
        <label>
          Name
          <input type="text" name="name" placeholder="Your name">
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com">
        </label>
        <label>
          Message
          <textarea name="message" rows="4" placeholder="Write your message..."></textarea>
        </label>
        <button type="submit" class="btn primary">Send</button>
      </form>
      <p class="note">Form is visual only until you hook it to a backend.</p>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 Ppertenrex</p>
</footer>

<script>
document.querySelector("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = e.target.name.value;
  const email = e.target.email.value;
  const message = e.target.message.value;

  await fetch("https://discord.com/api/webhooks/1536910850227441749/YMaQ7CNSyqnJl-Xgi9nh7TlM9AcCps8tXpbtP02korpfXPFQg4KmXZ0fqH4WkisiNOKf", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      embeds: [{
        title: "New Portfolio Contact",
        "content": "<@1159699378571857951>",
        color: 7506394,
        fields: [
          { name: "Name", value: name },
          { name: "Email", value: email },
          { name: "Message", value: message }
        ]
      }]
    })
  });

  alert("Message sent!");
});
</script>

</body>
</html>
